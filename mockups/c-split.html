<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Макет В — Разворот</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<style>
  /* Разворот: на компьютере слева фото со счётчиком, справа светлая «студия» с лототроном.
     На телефоне фото — верхняя полоса, ниже лототрон и карточка. */
  body{background:radial-gradient(70% 50% at 50% 55%,#fff,transparent 70%),linear-gradient(180deg,#f3f9f5,#e2eee7)}
  .photo{position:fixed;left:0;right:0;top:0;height:30vh;overflow:hidden;background:#5b0c18}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:60% 8%}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#eef6f1)}
  .photo #cd{display:none}
  .hello{position:fixed;left:var(--gl);right:var(--gr);top:calc(30vh - 34px);z-index:3;color:var(--green);text-align:center}
  .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));z-index:3;display:flex;flex-direction:column;gap:10px}
  @media (min-width:900px){
    .photo{right:auto;width:44vw;height:100%}
    .photo::after{background:linear-gradient(90deg,transparent 70%,rgba(238,246,241,.9))}
    .photo #cd{display:block;position:absolute;left:50%;bottom:8vh;transform:translateX(-50%);width:min(360px,80%);z-index:1}
    .hello{left:44vw;top:calc(28px + env(safe-area-inset-top,0px))}
    .bottom{left:auto;right:4vw;transform:none;top:50%;bottom:auto;translate:0 -50%;width:340px}
    #drum{left:44vw;width:36vw}
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<span class="mock-tag">Макет В · Разворот</span>
<div class="photo"><img src="assets/hero-woman.jpg" alt=""><div id="cd"></div></div>
<canvas id="drum" aria-label="Лототрон с купонами"></canvas>
<p class="hello" id="hello">Здравствуй, Ангелина!</p>
<div class="bottom" id="bottom">
  <div id="panel"></div>
  <nav class="nav"><button data-open="prizes">Призы</button><button data-open="mech">Механика</button></nav>
</div>

<script type="module">
import { createDrum } from './shared/drum.js';
import { createStars } from './shared/stars.js';
import { DEMO, mountCountdown, mountPanel } from './shared/ui.js';
await document.fonts.ready;

mountCountdown(document.getElementById('cd'));
const drum = await createDrum(document.getElementById('drum'));
mountPanel(document.getElementById('panel'), {
  onTab: t => { t === 'me' ? drum.showMine({ name: DEMO.full, count: DEMO.coupons }) : drum.showAll({ name: DEMO.full, mine: DEMO.coupons, others: DEMO.total - DEMO.coupons }); layout(); },
});
function layout() {
  const wide = innerWidth >= 900;
  const top = document.getElementById('hello').getBoundingClientRect().bottom + 6;
  const bottom = wide ? innerHeight - 60 : document.getElementById('bottom').getBoundingClientRect().top - 4;
  drum.setLayout({ topPx: top, bottomPx: bottom });
}
addEventListener('resize', layout);
drum.showMine({ name: DEMO.full, count: DEMO.coupons }); layout();

const cd = document.getElementById('cd'), pn = document.getElementById('panel');
const wide = () => innerWidth >= 900;
createStars([
  { el: () => wide() ? cd : null, ax: 0, ay: 0, dx: 4, dy: 2, size: 50, tilt: .2 },
  { el: () => wide() ? cd : null, ax: 1, ay: 1, dx: -8, dy: -4, size: 42, tilt: -.2 },
  { el: () => wide() ? null : document.getElementById('hello'), ax: .9, ay: 0, dx: 0, dy: -20, size: 40, tilt: .3 },
  { el: pn, ax: 1, ay: 0, dx: -10, dy: -6, size: 46, tilt: -.25 },
  { el: () => wide() ? null : pn, ax: 0, ay: 0, dx: 8, dy: -14, size: 32, tilt: .3 },
], { zIndex: 10 });
</script>
</body>
</html>
