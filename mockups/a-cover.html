<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Макет А — Обложка</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<style>
  /* Экран 1 — обложка: женщина + счётчик. Листаешь вниз — экран доезжает до лототрона и там фиксируется,
     чтобы перетаскивание барабана не прокручивало страницу. Назад — по надписи «Дятьково Design». */
  body{background:var(--curtain)}
  .scroller{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:none;scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .scroller.locked{overflow:hidden}
  .scroller > section{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}

  .cover{background:linear-gradient(90deg,#4a0912,#6b1020 60%,#4a0912)}
  .cover .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:92% 18%}
  .logo{position:absolute;z-index:2;top:calc(18px + env(safe-area-inset-top,0px));left:var(--gl);width:150px;mix-blend-mode:screen}
  .cover::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,transparent,rgba(40,4,10,.75));pointer-events:none}
  .cover-ui{position:absolute;z-index:1;left:var(--gl);right:var(--gr);bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
  .cover-ui .countdown{width:min(380px,100%)}
  .hint{border:0;background:none;color:#fff;font-weight:700;font-size:14px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .hint svg{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
  @media (min-width:900px){
    .cover .photo{width:62%;right:auto;object-position:0% 20%;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
    .cover::after{display:none}
    .logo{display:none}
    .cover-ui{left:auto;right:7vw;top:50%;bottom:auto;transform:translateY(-50%);width:400px}
    .hint{margin-top:10px}
  }

  .game{background:radial-gradient(60% 45% at 50% 45%, #ffffff, transparent 70%),radial-gradient(120% 90% at 50% 0%, #f4faf6, #e3efe8)}
  .game #drum{position:absolute}
  .g-top{position:absolute;top:0;left:0;right:0;z-index:3;padding:calc(18px + env(safe-area-inset-top,0px)) var(--gr) 0 var(--gl);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--green)}
  .brand{border:0;background:none;font-weight:800;font-size:14px;letter-spacing:.18em;color:var(--green);padding:4px}
  .g-bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));z-index:3;display:flex;flex-direction:column;gap:10px}
  @media (min-width:900px){
    .g-bottom{left:6vw;transform:none;top:50%;bottom:auto;translate:0 -40%}
    .game #drum{left:34vw;width:66vw}
  }
  @media (prefers-reduced-motion: reduce){ .hint svg{animation:none} }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<span class="mock-tag">Макет А · Обложка</span>

<div class="scroller" id="scroller">
  <section class="cover" id="cover">
    <img class="photo" src="assets/hero-woman.jpg" alt="">
    <img class="logo" src="assets/logo.jpg" alt="Дятьково Design">
    <div class="cover-ui">
      <div id="cd"></div>
      <button class="hint" id="hint">Листай вниз — твой лототрон
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </section>

  <section class="game" id="game">
    <canvas id="drum" aria-label="Лототрон с купонами"></canvas>
    <header class="g-top" id="gtop">
      <button class="brand" id="back" title="Вернуться на обложку">ДЯТЬКОВО DESIGN</button>
      <p class="hello">Здравствуй, Ангелина!</p>
    </header>
    <div class="g-bottom" id="gbottom">
      <div id="panel"></div>
      <nav class="nav"><button data-open="prizes">Призы</button><button data-open="mech">Механика</button></nav>
    </div>
  </section>
</div>

<script type="module">
import { createDrum } from './shared/drum.js';
import { createStars } from './shared/stars.js';
import { DEMO, mountCountdown, mountPanel } from './shared/ui.js';
await document.fonts.ready;

const $ = id => document.getElementById(id);
mountCountdown($('cd'));
const drum = await createDrum($('drum'));
mountPanel($('panel'), {
  onTab: t => { t === 'me' ? drum.showMine({ name: DEMO.full, count: DEMO.coupons }) : drum.showAll({ name: DEMO.full, mine: DEMO.coupons, others: DEMO.total - DEMO.coupons }); layout(); },
});
// разметка считается относительно холста барабана — он едет вместе со вторым экраном
function layout() {
  const wide = innerWidth >= 900, c = $('drum').getBoundingClientRect().top;
  const top = $('gtop').getBoundingClientRect().bottom + 8 - c;
  const bottom = wide ? innerHeight - 70 : $('gbottom').getBoundingClientRect().top - 6 - c;
  drum.setLayout({ topPx: top, bottomPx: bottom });
}
addEventListener('resize', layout);
drum.showMine({ name: DEMO.full, count: DEMO.coupons }); layout();

// скролл: доехали до лототрона — фиксируем экран; логотип — назад на обложку
const sc = $('scroller'), game = $('game');
let locked = false;
sc.addEventListener('scroll', () => {
  if (!locked && sc.scrollTop >= game.offsetTop - 2) { locked = true; sc.classList.add('locked'); drum.showMine({ name: DEMO.full, count: DEMO.coupons }); }
});
$('hint').onclick = () => sc.scrollTo({ top: game.offsetTop, behavior: 'smooth' });
$('back').onclick = () => { locked = false; sc.classList.remove('locked'); sc.scrollTo({ top: 0, behavior: 'smooth' }); };

// звёзды: три вокруг счётчика на обложке, три вокруг карточки на экране лототрона — едут вместе со страницей
const cd = $('cd'), pn = $('panel');
createStars([
  { el: cd, ax: 0, ay: 0, dx: 4, dy: 2, size: 54, tilt: .2 },
  { el: cd, ax: 1, ay: 0, dx: -6, dy: -14, size: 40, tilt: -.3 },
  { el: cd, ax: 1, ay: 1, dx: -10, dy: -6, size: 46, tilt: .1 },
  { el: pn, ax: 1, ay: 0, dx: -8, dy: -4, size: 48, tilt: -.2 },
  { el: pn, ax: 0, ay: 0, dx: 6, dy: -10, size: 34, tilt: .3 },
  { el: pn, ax: 1, ay: 1, dx: -4, dy: -40, size: 30, tilt: .4 },
], { zIndex: 10 });
</script>
</body>
</html>
