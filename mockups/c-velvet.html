<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Макет В — Бархат</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<style>
  /* Как «Сцена», но без фото: настоящая 3D-сцена — бархатный занавес, кулисы на золотых подхватах, ламбрекен, прожектор. */
  body{background:#0b3a2a}
  #stage{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  .logo{position:fixed;z-index:3;top:calc(56px + env(safe-area-inset-top,0px));left:var(--gl);width:130px;mix-blend-mode:screen;filter:grayscale(1) contrast(4)}
  .top{position:fixed;top:0;left:0;right:0;z-index:3;padding:calc(104px + env(safe-area-inset-top,0px)) var(--gr) 0 var(--gl)}
  .top .hello{color:#fff;font-size:17px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));z-index:3;display:flex;flex-direction:column;gap:10px}
  @media (min-width:900px){
    .logo{top:calc(64px + env(safe-area-inset-top,0px));left:5vw;width:170px}
    .top{padding:calc(130px + env(safe-area-inset-top,0px)) 0 0 5vw}
    .top .hello{font-size:24px}
    .bottom{left:5vw;transform:none;bottom:7vh;width:400px}
    #drum{left:auto;right:0;width:62vw}
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<span class="mock-tag">Макет В · Бархат</span>
<canvas id="stage" aria-hidden="true"></canvas>
<img class="logo" src="assets/logo.jpg" alt="Дятьково Design">
<canvas id="drum" aria-label="Лототрон с купонами"></canvas>
<header class="top" id="top"><p class="hello">Здравствуй, Ангелина!</p></header>
<div class="bottom" id="bottom">
  <div id="panel"></div>
  <nav class="nav ghost"><button data-open="prizes">Призы</button><button data-open="mech">Механика</button></nav>
</div>

<script type="module">
import { createDrum } from './shared/drum.js';
import { createStage } from './shared/stage.js';
import { createStars } from './shared/stars.js';
import { DEMO, mountPanel } from './shared/ui.js';
await document.fonts.ready;

createStage(document.getElementById('stage'));
const drum = await createDrum(document.getElementById('drum'));
mountPanel(document.getElementById('panel'), {
  onTab: t => { t === 'me' ? drum.showMine({ name: DEMO.full, count: DEMO.coupons }) : drum.showAll({ name: DEMO.full, mine: DEMO.coupons, others: DEMO.total - DEMO.coupons }); layout(); },
});
// без фото барабан может быть крупнее и стоять в луче прожектора
function layout() {
  const wide = innerWidth >= 900;
  const top = wide ? innerHeight * .14 : document.getElementById('top').getBoundingClientRect().bottom + 4;
  const bottom = wide ? innerHeight - 50 : document.getElementById('bottom').getBoundingClientRect().top - 4;
  drum.setLayout({ topPx: top, bottomPx: bottom });
}
addEventListener('resize', layout);
drum.showMine({ name: DEMO.full, count: DEMO.coupons }); layout();

const pn = document.getElementById('panel'), top = document.getElementById('top');
createStars([
  { el: pn, ax: 0, ay: 0, dx: 10, dy: 4, size: 50, tilt: .25, desk: { size: 92, dx: 14, dy: 6 } },
  { el: pn, ax: 1, ay: 0, dx: -6, dy: -18, size: 38, tilt: -.3, desk: { size: 64, dx: 4, dy: -30 } },
  { el: pn, ax: 1, ay: 1, dx: -14, dy: -70, size: 34, tilt: .1, desk: { size: 76, dx: -6, dy: -88 } },
  { el: top, ax: .86, ay: 0, dx: 0, dy: 60, size: 40, tilt: .15, desk: { size: 60, ax: .9, dy: 150 } },
], { zIndex: 10 });
</script>
</body>
</html>
