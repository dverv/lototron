<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5e0b16">
<title>Конкурс-лотерея Дятьково Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611271800">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<span class="badge" id="badge" hidden></span>

<div class="scroller" id="scroller">
  <!-- экран 1: обложка -->
  <section class="cover" id="cover">
    <picture>
      <!-- телефон: вертикальный кадр; компьютер: широкий. Размеры с запасом под Retina, чтобы фото было чётким -->
      <source media="(max-aspect-ratio: 4/5)" srcset="assets/photo-mobile-1500.jpg 960w, assets/photo-mobile-2600.jpg 1670w" sizes="66vh">
      <img class="photo" src="assets/photo-2400.jpg" srcset="assets/photo-1600.jpg 1600w, assets/photo-2400.jpg 2400w, assets/photo-3600.jpg 3600w" sizes="100vw" alt="">
    </picture>
    <img class="logo" src="assets/logo.png" alt="Дятьково Design">
    <div class="cover-ui">
      <div class="countdown plate" id="countdown">
        <div class="t">КОНКУРС-ЛОТЕРЕЯ</div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="units"><span>дней</span><span>часов</span><span>минут</span></div>
        <div class="till">розыгрыш 30 декабря</div>
      </div>
      <button class="hint" id="hint">Листай вниз — твой лототрон
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </section>

  <!-- экран 2: лототрон -->
  <section class="game" id="game">
    <svg class="flake a" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#flake"/></svg>
    <svg class="flake b" viewBox="-100 -100 200 200" aria-hidden="true"><use href="#flake"/></svg>
    <canvas id="drum" aria-label="Лототрон с купонами. Потяни вверх или вниз, чтобы прокрутить."></canvas>
    <div class="side" id="side">
      <p class="hello" id="hello">Найди себя</p>

      <div class="panel plate" id="panel" hidden></div>

      <div class="panel plate picker" id="picker" hidden>
        <h2>Найди себя</h2>
        <p>Начни вводить фамилию — покажем совпадения.</p>
        <input id="q" type="search" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Фамилия" aria-label="Фамилия">
        <ul class="found" id="found"></ul>
        <p class="note" id="pickNote">Нужно хотя бы 3 буквы.</p>
      </div>

      <nav class="nav"><button data-open="prizes">Призы</button><button data-open="mech">Механика</button></nav>
      <button class="notme" id="notMe" hidden>Это не я</button>
    </div>
  </section>
</div>

<!-- снежинка: шесть лучей с веточками, тонкая линия -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="arm" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <path d="M0 0 V-92"/><path d="M0 -34 L-20 -54 M0 -34 L20 -54"/><path d="M0 -60 L-15 -75 M0 -60 L15 -75"/>
    </g>
    <g id="flake">
      <use href="#arm"/><use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
    </g>
  </defs>
</svg>

<div class="loading" id="loading">Загружаем купоны…</div>
<script type="module" src="js/app.js?v=202611271708"></script>
</body>
</html>
